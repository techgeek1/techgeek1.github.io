site_name: 0ms
site_url: https://techgeek1.dev
site_description: Senior Software Engineer - Systems architecture, performance, and the foundational work that makes scale possible.
copyright: Copyright (C) 2025 Austin Rife

theme:
  name: material
  custom_dir: docs/.overrides
  icon:
    logo: custom/logo
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference
  features:
    - navigation.instant
    - navigation.tracking
    - content.code.copy
    - toc.integrate

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/techgeek1
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/austin-rife

extra_css:
  - stylesheets/custom.css

extra_javascript:
  - js/cards.js

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html

plugins: []

nav:
  - About: index.md
